name: my-app

services:

  db:
    image: postgres:17
    container_name: pg

    environment:
      POSTGRES_DB: my_app
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 8b2brksk1582SQL

    ports:
      - "5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    restart: always

  backend:
    build:
      context: ./backend

    container_name: backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/my_app
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 8b2brksk1582SQL

    depends_on:
      - db

    restart: always

  frontend:
    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: always

volumes:
  db-data: